<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>交通及天氣看板</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 1px solid #334155;
            margin-bottom: 12px;
        }
        #clock {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #38bdf8;
            line-height: 1;
        }
        #date {
            font-size: 1.05rem;
            color: #94a3b8;
            margin-top: 4px;
        }

        main {
            display: flex;
            flex: 1;
            gap: 16px;
            height: calc(100% - 90px);
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .weather-grid { display: flex; gap: 10px; height: 100%; }
        .district-box {
            flex: 1;
            background: #1e293b;
            border-radius: 12px;
            padding: 14px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
        .district-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 8px;
            border-bottom: 1px dashed #475569;
            padding-bottom: 6px;
        }
        .day-weather { margin-bottom: 8px; }
        .day-weather:last-child { margin-bottom: 0; }
        .day-label { font-size: 0.85rem; color: #94a3b8; }
        .temp-row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; }
        .temp-val { font-size: 1.35rem; font-weight: bold; }
        .weather-icon { width: 45px; height: 45px; object-fit: contain; }
        .weather-desc { font-size: 0.85rem; color: #cbd5e1; line-height: 1.3; }

        .bus-panel {
            flex: 1.3;
            background: #1e293b;
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #f59e0b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-btn {
            background: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .settings-btn:active { background: #475569; }

        .bus-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .bus-item {
            background: #334155;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .bus-header { display: flex; justify-content: space-between; align-items: baseline; }
        .bus-title-group { display: flex; align-items: center; gap: 8px; }
        .bus-company-tag {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .tag-kmb { background: #991b1b; color: #fca5a5; }
        .tag-ctb { background: #854d0e; color: #fef08a; }
        .tag-nlb { background: #166534; color: #bbf7d0; }

        .bus-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 1px;
            line-height: 1;
        }
        .bus-dest { font-size: 0.85rem; color: #cbd5e1; font-weight: 500; }

        .eta-group { display: flex; gap: 8px; align-items: center; }
        .eta-badge {
            flex: 1;
            background: #0f172a;
            border-radius: 6px;
            padding: 8px 4px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #94a3b8;
            border: 1px solid #475569;
        }
        .eta-badge.first {
            flex: 1.6;
            background: #064e3b;
            color: #34d399;
            border-color: #10b981;
            font-size: 1.5rem;
            font-weight: 900;
            padding: 6px 4px;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
        }
        .eta-badge.first.arr {
            background: #881337;
            color: #fb7185;
            border-color: #f43f5e;
            box-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
        }

        .loading-text {
            text-align: center;
            color: #94a3b8;
            padding: 20px;
            font-size: 0.9rem;
        }

        /* Modal 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #1e293b;
            border-radius: 16px;
            width: 90%;
            max-width: 580px;
            max-height: 85vh;
            padding: 16px;
            border: 1px solid #475569;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 8px;
        }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 1.4rem; cursor: pointer; }

        .config-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 360px; }
        .config-item {
            background: #0f172a;
            border-radius: 8px;
            padding: 10px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .config-row { display: flex; gap: 8px; align-items: center; }
        .config-input, .config-select {
            background: #1e293b;
            border: 1px solid #475569;
            color: #fff;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .config-input { flex: 1; }
        .delete-btn {
            background: #991b1b;
            color: #fca5a5;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #334155;
            padding-top: 10px;
        }
        .action-btn { background: #0284c7; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .add-btn { background: #166534; color: #86efac; }
        .hint-text { font-size: 0.75rem; color: #94a3b8; }
    </style>
</head>
<body>

    <header>
        <div id="clock">00:00:00</div>
        <div id="date">--年--月--日 星期-</div>
    </header>

    <main>
        <div class="left-panel">
            <div class="weather-grid">
                <div class="district-box">
                    <div class="district-title">📍 東涌 (Tung Chung)</div>
                    <div class="day-weather">
                        <div class="day-label">今天</div>
                        <div class="temp-row">
                            <span class="temp-val" id="tc-today-temp">--°C</span>
                            <img class="weather-icon" id="tc-today-icon" src="" alt="icon">
                        </div>
                        <div class="weather-desc" id="tc-today-desc">加載中...</div>
                    </div>
                    <div class="day-weather">
                        <div class="day-label">明天</div>
                        <div class="temp-row">
                            <span class="temp-val" id="tc-tomorrow-temp">--°C</span>
                            <img class="weather-icon" id="tc-tomorrow-icon" src="" alt="icon">
                        </div>
                        <div class="weather-desc" id="tc-tomorrow-desc">加載中...</div>
                    </div>
                </div>

                <div class="district-box">
                    <div class="district-title">📍 尖沙咀 (Tsim Sha Tsui)</div>
                    <div class="day-weather">
                        <div class="day-label">今天</div>
                        <div class="temp-row">
                            <span class="temp-val" id="tst-today-temp">--°C</span>
                            <img class="weather-icon" id="tst-today-icon" src="" alt="icon">
                        </div>
                        <div class="weather-desc" id="tst-today-desc">加載中...</div>
                    </div>
                    <div class="day-weather">
                        <div class="day-label">明天</div>
                        <div class="temp-row">
                            <span class="temp-val" id="tst-tomorrow-temp">--°C</span>
                            <img class="weather-icon" id="tst-tomorrow-icon" src="" alt="icon">
                        </div>
                        <div class="weather-desc" id="tst-tomorrow-desc">加載中...</div>
                    </div>
                </div>
            </div>
        </div>

        <section class="bus-panel">
            <div class="panel-title">
                <span>🚌 巴士到站動態 (每分鐘更新)</span>
                <button class="settings-btn" onclick="openSettings()">⚙️ 路線設定</button>
            </div>
            <div class="bus-list" id="bus-list"></div>
        </section>
    </main>

    <!-- 設定彈窗 Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">⚙️ 設定巴士路線及車站</div>
                <button class="modal-close" onclick="closeSettings()">&times;</button>
            </div>
            <div class="hint-text">
                💡 <b>填寫指南</b>：<br>
                • <b>九巴 (KMB)</b>：填 App 站代碼（如 <code>TC188</code>）或 Stop ID。<br>
                • <b>城巴/嶼巴</b>：直接填 App 內的中文/英文<b>站名</b>（如 <code>東涌纜車站</code>）。
            </div>
            <div class="config-list" id="config-list"></div>
            <div class="modal-footer">
                <button class="action-btn add-btn" onclick="addNewBusConfig()">+ 新增路線</button>
                <button class="action-btn" onclick="saveBusConfig()">💾 保存並即時更新</button>
            </div>
        </div>
    </div>

    <script>
        const defaultBuses = [
            { company: "kmb", route: "1A", stop: "TC188", dest_name: "往 尖沙咀碼頭" },
            { company: "ctb", route: "E33", stop: "東涌纜車站", dest_name: "往 機場/東涌" },
            { company: "nlb", route: "23", stop: "昂坪", dest_name: "往 昂坪" }
        ];

        let currentBuses = [];
        let cachedEtas = {}; // 暫存歷史到站時間，防閃爍

        function loadBusConfigs() {
            const saved = localStorage.getItem('user_bus_configs_v2');
            if (saved) {
                try { currentBuses = JSON.parse(saved); } catch(e) { currentBuses = defaultBuses; }
            } else {
                currentBuses = defaultBuses;
            }
        }

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
            const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            document.getElementById('date').innerText = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日 ${weekDays[now.getDay()]}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchWeather() {
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const data = await res.json();
                if (data.weatherForecast && data.weatherForecast.length >= 2) {
                    const today = data.weatherForecast[0];
                    const tomorrow = data.weatherForecast[1];

                    const getIconUrl = (code) => `https://www.hko.gov.hk/images/HKOWxIconOutline/pic${code}.png`;
                    const getDesc = (item) => item.forecastWeather || item.forecastForecast || "大致多雲";

                    document.getElementById('tc-today-temp').innerText = `${today.forecastMintemp.value}°C - ${today.forecastMaxtemp.value}°C`;
                    document.getElementById('tc-today-desc').innerText = getDesc(today);
                    document.getElementById('tc-today-icon').src = getIconUrl(today.ForecastIcon);

                    document.getElementById('tst-today-temp').innerText = `${today.forecastMintemp.value}°C - ${today.forecastMaxtemp.value}°C`;
                    document.getElementById('tst-today-desc').innerText = getDesc(today);
                    document.getElementById('tst-today-icon').src = getIconUrl(today.ForecastIcon);

                    document.getElementById('tc-tomorrow-temp').innerText = `${tomorrow.forecastMintemp.value}°C - ${tomorrow.forecastMaxtemp.value}°C`;
                    document.getElementById('tc-tomorrow-desc').innerText = getDesc(tomorrow);
                    document.getElementById('tc-tomorrow-icon').src = getIconUrl(tomorrow.ForecastIcon);

                    document.getElementById('tst-tomorrow-temp').innerText = `${tomorrow.forecastMintemp.value}°C - ${tomorrow.forecastMaxtemp.value}°C`;
                    document.getElementById('tst-tomorrow-desc').innerText = getDesc(tomorrow);
                    document.getElementById('tst-tomorrow-icon').src = getIconUrl(tomorrow.ForecastIcon);
                }
            } catch (err) {}
        }
        fetchWeather();
        setInterval(fetchWeather, 300000);

        async function getKMBSeta(route, stopCode) {
            try {
                let targetStopId = stopCode;
                if (stopCode.length < 10) {
                    const stopRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop`);
                    const stopData = await stopRes.json();
                    const matched = stopData.data.find(s => s.stop === stopCode || s.name_tc.includes(stopCode));
                    if (matched) targetStopId = matched.stop;
                }
                const etaRes = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/stop-eta/${targetStopId}`);
                const etaData = await etaRes.json();
                return etaData.data.filter(i => i.route.toUpperCase() === route.toUpperCase());
            } catch (e) { return []; }
        }

        async function getCTBETA(route, stopName) {
            try {
                const stopsRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/route-stop/CTB/${route.toUpperCase()}/outbound`);
                const stopsData = await stopsRes.json();
                
                let stopId = "";
                for (let s of stopsData.data) {
                    const infoRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/stop/${s.stop}`);
                    const info = await infoRes.json();
                    if (info.data.name_tc.includes(stopName) || info.data.name_en.toLowerCase().includes(stopName.toLowerCase())) {
                        stopId = s.stop;
                        break;
                    }
                }
                if (!stopId && stopsData.data.length > 0) stopId = stopsData.data[0].stop;

                const etaRes = await fetch(`https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/${stopId}/${route.toUpperCase()}`);
                const etaData = await etaRes.json();
                return etaData.data;
            } catch (e) { return []; }
        }

        async function getNLBETA(route, stopName) {
            try {
                const res = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=list`);
                const data = await res.json();
                const matchedStop = data.stops.find(s => s.stopName_c.includes(stopName));
                if (!matchedStop) return [];

                const etaRes = await fetch(`https://rt.data.gov.hk/v2/transport/nlb/stop.php?action=estimatedArrivals&stopId=${matchedStop.stopId}&routeId=${route}`);
                const etaData = await etaRes.json();
                return etaData.estimatedArrivals.map(i => ({ eta: i.estimatedArrivalAt }));
            } catch (e) { return []; }
        }

        async function fetchBusData() {
            loadBusConfigs();
            const busListContainer = document.getElementById('bus-list');

            if (currentBuses.length === 0) {
                busListContainer.innerHTML = '<div class="loading-text">尚未設定任何路線</div>';
                return;
            }

            const companyOrder = { kmb: 1, ctb: 2, nlb: 3 };
            const sortedBuses = [...currentBuses].sort((a, b) => (companyOrder[a.company] || 99) - (companyOrder[b.company] || 99));

            let newHtml = '';
            for (let bus of sortedBuses) {
                const busKey = `${bus.company}_${bus.route}_${bus.stop}`;
                let rawEtas = [];

                if (bus.company === 'kmb') {
                    rawEtas = await getKMBSeta(bus.route, bus.stop);
                } else if (bus.company === 'ctb') {
                    rawEtas = await getCTBETA(bus.route, bus.stop);
                } else if (bus.company === 'nlb') {
                    rawEtas = await getNLBETA(bus.route, bus.stop);
                }

                let etas = rawEtas.slice(0, 3).map(item => {
                    if (!item.eta) return null;
                    const diffMins = Math.round((new Date(item.eta) - new Date()) / 60000);
                    if (diffMins <= 1) return '即將到站';
                    return `${diffMins} 分鐘`;
                }).filter(Boolean);

                // 若本次未撈到新資料，則優先使用上次快取的舊資料，避免顯示 "-"
                if (etas.length > 0) {
                    cachedEtas[busKey] = etas;
                } else if (cachedEtas[busKey]) {
                    etas = cachedEtas[busKey];
                }

                while (etas.length < 3) etas.push('-');

                const isArr = etas[0] === '即將到站';
                const companyTag = bus.company === 'kmb' ? '<span class="bus-company-tag tag-kmb">九巴</span>' : 
                                   bus.company === 'ctb' ? '<span class="bus-company-tag tag-ctb">城巴</span>' : 
                                   '<span class="bus-company-tag tag-nlb">嶼巴</span>';

                newHtml += `
                    <div class="bus-item">
                        <div class="bus-header">
                            <div class="bus-title-group">
                                ${companyTag}
                                <div class="bus-name">${bus.route.toUpperCase()}</div>
                            </div>
                            <div class="bus-dest">${bus.dest_name}</div>
                        </div>
                        <div class="eta-group">
                            <div class="eta-badge first ${isArr ? 'arr' : ''}">${etas[0]}</div>
                            <div class="eta-badge">${etas[1]}</div>
                            <div class="eta-badge">${etas[2]}</div>
                        </div>
                    </div>
                `;
            }
            busListContainer.innerHTML = newHtml;
        }

        fetchBusData();
        setInterval(fetchBusData, 60000);

        function openSettings() {
            loadBusConfigs();
            renderSettingsList();
            document.getElementById('settings-modal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('active');
        }

        function renderSettingsList() {
            const container = document.getElementById('config-list');
            container.innerHTML = '';

            currentBuses.forEach((bus, index) => {
                const itemHtml = `
                    <div class="config-item">
                        <div class="config-row">
                            <select class="config-select bus-company">
                                <option value="kmb" ${bus.company === 'kmb' ? 'selected' : ''}>九巴 (KMB)</option>
                                <option value="ctb" ${bus.company === 'ctb' ? 'selected' : ''}>城巴 (CTB)</option>
                                <option value="nlb" ${bus.company === 'nlb' ? 'selected' : ''}>嶼巴 (NLB)</option>
                            </select>
                            <input type="text" class="config-input bus-route" placeholder="路線 (例: 1A / E33)" value="${bus.route}">
                            <button class="delete-btn" onclick="deleteBusConfig(${index})">刪除</button>
                        </div>
                        <div class="config-row">
                            <input type="text" class="config-input bus-stop" placeholder="App 站代號 (如 TC188) 或 站名 (如 東涌纜車站)" value="${bus.stop}">
                            <input type="text" class="config-input bus-dest" placeholder="顯示目的地 (如 往 尖沙咀)" value="${bus.dest_name}">
                        </div>
                    </div>
                `;
                container.innerHTML += itemHtml;
            });
        }

        function addNewBusConfig() {
            currentBuses.push({ company: "kmb", route: "", stop: "", dest_name: "" });
            renderSettingsList();
        }

        function deleteBusConfig(index) {
            currentBuses.splice(index, 1);
            renderSettingsList();
        }

        function saveBusConfig() {
            const items = document.querySelectorAll('.config-item');
            const newConfigs = [];

            items.forEach(item => {
                const company = item.querySelector('.bus-company').value;
                const route = item.querySelector('.bus-route').value.trim();
                const stop = item.querySelector('.bus-stop').value.trim();
                const dest_name = item.querySelector('.bus-dest').value.trim();

                if (route && stop) {
                    newConfigs.push({ company, route, stop, dest_name });
                }
            });

            currentBuses = newConfigs;
            localStorage.setItem('user_bus_configs_v2', JSON.stringify(currentBuses));
            
            closeSettings();
            fetchBusData();
        }
    </script>
</body>
</html>
