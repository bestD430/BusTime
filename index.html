<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>交通及天氣看板</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:#0f172a;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  height:100vh;display:flex;flex-direction:column;padding:16px;overflow:hidden
}
header{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid #334155;flex-shrink:0
}
.header-left{display:flex;flex-direction:column;gap:6px}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.clock-container,.time-sub-info,.weather-sub-bar,.weather-info-box,.weather-warnings,
.night-time-sub-info,.night-weather-box,.config-row{display:flex;align-items:center}
.clock-container,.time-sub-info{justify-content:flex-end}
.time-sub-info{gap:8px;margin-top:4px}

#clock,.night-clock{
  font-size:48px;font-weight:700;letter-spacing:2px;color:#fff;line-height:1;
  display:flex;align-items:center
}
.clock-sub-box{
  display:inline-flex;flex-direction:column;align-items:flex-start;justify-content:center;
  margin-left:6px;line-height:1.1
}
.clock-ampm,.clock-seconds{font-size:21px;font-weight:600;line-height:1.1;display:block;white-space:nowrap}
.clock-seconds{opacity:.85}

#date,.night-date{font-size:1rem;color:#94a3b8;text-align:right;white-space:nowrap}

.weather-sub-bar{gap:8px;flex-wrap:wrap}
.weather-info-box{
  gap:6px;background:#1e293b;padding:2px 10px;border:1px solid #334155;border-radius:20px
}
.weather-icon{width:36px;height:36px;object-fit:contain}
.weather-emoji{font-size:2.475rem;line-height:1}
.weather-temp{font-size:2.25rem;font-weight:bold;color:#38bdf8}
.weather-psr{
  font-size:.85rem;font-weight:600;color:#38bdf8;background:#1e293b;
  padding:2px 8px;border:1px solid #0284c7;border-radius:12px;white-space:nowrap
}
.weather-warnings{gap:6px;flex-wrap:wrap}

.warning-badge{
  display:inline-flex;align-items:center;justify-content:center;
  padding:3px 15px;border-radius:20px;font-size:1.32rem;font-weight:bold;
  color:#fff;box-shadow:0 2px 4px #0004;white-space:nowrap
}
.badge-none{background:#334155;color:#94a3b8}
.badge-yellow-rain{background:#eab308;color:#000}
.badge-red-rain{background:#dc2626}
.badge-black-rain{background:#000;border:1px solid #475569}
.badge-tc{background:#ea580c}
.badge-ts{background:#7c3aed}

.school-notice{
  display:none;background:#dc2626;color:#fff;padding:10px 14px;border-radius:12px;
  font-size:1.5rem;font-weight:bold;text-align:center;margin-bottom:12px;
  border:2px solid #f87171;box-shadow:0 4px 12px #dc262266;flex-shrink:0
}

main{display:flex;flex:1;flex-direction:column;gap:16px;overflow:hidden}
.bus-panel{
  flex:1;background:#1e293b;border-radius:16px;padding:14px;
  display:flex;flex-direction:column;overflow:hidden
}
.panel-title{
  font-size:.9rem;font-weight:bold;margin-bottom:6px;color:#f59e0b;
  display:flex;justify-content:space-between;align-items:center;flex-shrink:0
}
.settings-btn,.action-btn,.delete-btn{cursor:pointer}
.settings-btn{
  background:#334155;color:#f8fafc;border:1px solid #475569;
  padding:4px 8px;border-radius:6px;font-size:.75rem
}
.bus-list{
  display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;padding-right:4px;
  -webkit-overflow-scrolling:touch
}
.bus-item{
  border-radius:10px;padding:8px 10px;display:flex;justify-content:space-between;
  align-items:center;gap:8px;width:100%;border:1px solid #fff3;color:#fff;
  box-shadow:0 3px 5px -1px #0000004d
}
.card-kmb{background:#d8121a}
.card-lwb{background:#f37021}
.card-ctb{background:#ffcc00;color:#000;border-color:#0002}
.card-nlb{background:#00843d}
.card-ctb .bus-name,.card-ctb .bus-origin-text{color:#000;text-shadow:none}
.card-ctb .bus-dest{color:#1e293b;text-shadow:none}
.card-nlb .bus-dest{color:#f1f5f9}

.bus-header-grid{
  display:grid;grid-template-columns:auto 1fr;column-gap:6px;row-gap:2px;
  align-items:center;flex:1;overflow:hidden
}
.bus-company-tag{
  grid-row:1;grid-column:1;writing-mode:vertical-rl;text-orientation:upright;
  font-size:.75rem;padding:3px 2px;border-radius:4px;font-weight:bold;
  background:#0f172add;border:1.5px solid #fff;color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px #0000004d;letter-spacing:1px;line-height:1
}
.card-kmb .bus-company-tag{background:#d8121a}
.card-lwb .bus-company-tag{background:#f37021}
.card-ctb .bus-company-tag{background:#ffcc00;color:#000;border-color:#000}
.card-nlb .bus-company-tag{background:#00843d}

.bus-name{
  grid-row:1;grid-column:2;font-size:3.8rem;font-weight:700;
  letter-spacing:1px;line-height:.95;color:#fff;text-shadow:0 2px 4px #0006
}
.bus-dest{
  grid-row:2;grid-column:2;display:flex;flex-direction:column;
  align-items:flex-start;gap:1px;width:100%;color:#f1f5f9;text-shadow:0 1px 2px #0008
}
.bus-origin-text,.bus-dest-text{
  text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%
}
.bus-origin-text{font-size:1.1rem;font-weight:800;line-height:1.2}
.bus-dest-text{font-size:.85rem;font-weight:600;opacity:.95;line-height:1.2}

.eta-group{
  display:flex;flex-direction:column;gap:3.15px;align-items:stretch;
  width:36%;margin-left:auto;flex-shrink:0
}
.eta-next-group{display:flex;gap:4px;width:100%;transform:translateY(5%)}
.eta-badge{
  flex:1;background:#0f172add;backdrop-filter:blur(4px);border-radius:6px;
  padding:4px .5px;text-align:center;font-size:.97rem;font-weight:bold;color:#fff;
  border:1px solid #fff2;display:flex;align-items:center;justify-content:center;
  white-space:nowrap;transform:scale(.97,1.02)
}
.eta-badge.first{
  width:100%;font-size:1.87rem;font-weight:900;padding:6px 1px;
  transform:translateY(-5%) scale(.97,1.02)
}
.eta-badge.eta-green{color:#34d399;border-color:#34d39966}
.eta-badge.eta-red{color:#d8121a;border-color:#d8121a99}

@keyframes flashRY{
  0%,49%{color:#d8121a;border-color:#d8121acc}
  50%,100%{color:#ffcc00;border-color:#ffcc00cc}
}
@keyframes flashRG{
  0%,49%{color:#d8121a;border-color:#d8121acc}
  50%,100%{color:#34d399;border-color:#34d399cc}
}
@keyframes flashRYG{
  0%,32%{color:#d8121a;border-color:#d8121acc}
  33%,65%{color:#ffcc00;border-color:#ffcc00cc}
  66%,100%{color:#34d399;border-color:#34d399cc}
}
.eta-flash{animation:flashRY 1s infinite}
.eta-flash-green{animation:flashRG 1s infinite}
.eta-flash-three{animation:flashRYG 1.2s infinite}
.loading-text{text-align:center;color:#94a3b8;padding:20px;font-size:.9rem}

/* 夜間模式 */
#night-screen{
  position:fixed;inset:0;background:#000;z-index:9999;display:none;
  flex-direction:column;justify-content:center;align-items:center;
  cursor:pointer;padding:24px;gap:16px
}
#night-screen.active{display:flex}
.night-time-sub-info{gap:12px;justify-content:center}
.night-weather-box{gap:12px;margin-top:10px}
.night-weather-icon{width:12vw;height:12vw;max-width:80px;max-height:80px;object-fit:contain}
.night-temp{font-size:8vw;font-weight:bold;color:#f8fafc}
.night-warnings{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.night-tip{
  position:absolute;bottom:24px;color:#334155;font-size:.85rem;
  letter-spacing:1px;user-select:none
}

/* 設定視窗 */
.modal-overlay{
  position:fixed;inset:0;background:#000b;display:none;
  justify-content:center;align-items:center;z-index:10000
}
.modal-overlay.active{display:flex}
.modal-content{
  background:#1e293b;border-radius:16px;width:90%;max-width:650px;max-height:85vh;
  padding:16px;border:1px solid #475569;display:flex;flex-direction:column;gap:12px
}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid #334155;padding-bottom:8px
}
.modal-title{font-size:1.1rem;font-weight:bold;color:#38bdf8}
.modal-close{
  background:none;border:0;color:#94a3b8;font-size:1.6rem;cursor:pointer;padding:4px
}
.night-time-section{
  background:#0f172a;border-radius:8px;padding:12px;border:1px solid #334155;
  display:flex;flex-direction:column;gap:8px
}
.night-time-title{font-size:.95rem;font-weight:bold;color:#f59e0b}
.night-time-inputs{display:flex;align-items:center;gap:10px;font-size:.9rem;color:#cbd5e1}
.config-list{
  display:flex;flex-direction:column;gap:10px;overflow-y:auto;
  max-height:45vh;-webkit-overflow-scrolling:touch
}
.config-item{
  background:#0f172a;border-radius:8px;padding:10px;border:1px solid #334155;
  display:flex;flex-direction:column;gap:8px
}
.config-row{gap:8px}
.config-input,.config-select{
  background:#1e293b;border:1px solid #475569;color:#fff;
  padding:8px;border-radius:6px;font-size:.9rem;outline:none
}
.config-route-container,.config-input.bus-origin,.config-input.bus-dest{flex:1}
.config-select.bus-stop{flex:1.5}
.delete-btn{
  background:#991b1b;color:#fca5a5;border:0;padding:8px 12px;
  border-radius:6px;font-size:.9rem
}
.modal-footer{
  display:flex;justify-content:space-between;border-top:1px solid #334155;
  padding-top:12px;margin-top:4px
}
.action-btn{
  background:#0284c7;color:#fff;border:0;padding:10px 16px;
  border-radius:8px;font-weight:bold;font-size:.95rem
}
.add-btn{background:#166534;color:#86efac}
.hint-text{font-size:.8rem;color:#94a3b8}

@media(min-width:768px){
  body{padding:24px;gap:8px}
  header{padding-bottom:16px;border-bottom-width:2px}
  #clock{font-size:48px;letter-spacing:4px}
  #date,.night-date{font-size:1.2rem}
  .weather-sub-bar{gap:12px}
  .weather-info-box{padding:4px 14px;border-radius:30px;gap:8px}
  .weather-icon{width:48px;height:48px}
  .weather-emoji{font-size:3.15rem}
  .weather-temp{font-size:2.925rem}
  .weather-psr{font-size:1rem;padding:3px 10px;border-radius:16px}
  .warning-badge{padding:9px 21px;font-size:1.65rem}
  .school-notice{font-size:1.95rem;padding:16px;border-radius:16px;margin-bottom:16px}
  .bus-panel{padding:24px;border-radius:24px}
  .panel-title{font-size:1rem;margin-bottom:14px}
  .settings-btn{font-size:.85rem;padding:6px 14px}
  .bus-list{gap:12px;padding-right:8px}
  .bus-item{padding:10px 16px;border-radius:14px;gap:12px}
  .bus-header-grid{column-gap:8px}
  .bus-company-tag{font-size:.85rem;padding:4px 3px;border-radius:5px}
  .bus-name{font-size:5rem;letter-spacing:2px}
  .bus-dest{gap:3px}
  .bus-origin-text{font-size:1.6rem}
  .bus-dest-text{font-size:1.15rem}
  .eta-group{gap:5.25px;width:32%}
  .eta-next-group{gap:6px}
  .eta-badge{font-size:1.27rem;padding:6px;border-radius:8px}
  .eta-badge.first{font-size:2.75rem;padding:6px;border-radius:10px}
  .modal-content{max-width:800px;padding:24px;gap:16px}
  .modal-title{font-size:1.4rem}
  .modal-close{font-size:2.2rem}
  .config-item{padding:16px;gap:14px;border-radius:12px}
  .config-input,.config-select{font-size:1.1rem;padding:12px}
  .delete-btn{font-size:1.05rem;padding:12px 16px}
  .action-btn{font-size:1.2rem;padding:14px 24px}
  .hint-text{font-size:1rem}
  .night-clock{font-size:14rem}
  .night-date{font-size:2.5rem}
  .night-temp{font-size:6rem}
}
</style>
</head>

<body>

<!-- 夜間模式 -->
<div id="night-screen" onclick="wakeUpNightScreen()">
  <div id="night-clock" class="night-clock"></div>
  <div class="night-time-sub-info">
    <div id="night-date" class="night-date">--年--月--日 星期-</div>
    <span id="night-weather-psr" class="weather-psr" style="display:none"></span>
  </div>
  <div class="night-weather-box">
    <img id="night-weather-icon" class="night-weather-icon" alt="weather icon" style="display:none">
    <span id="night-weather-emoji" class="weather-emoji" style="display:none">🌙</span>
    <span id="night-temp" class="night-temp">--°C</span>
  </div>
  <div id="night-warnings" class="night-warnings">
    <span class="warning-badge badge-none">🌙 天氣良好</span>
  </div>
  <div class="night-tip">輕按一下顯示路線資料</div>
</div>

<header>
  <div class="header-left">
    <div class="weather-sub-bar">
      <div class="weather-info-box" id="weather-info-box" style="display:none">
        <img id="weather-icon" class="weather-icon" alt="weather icon">
        <span id="weather-emoji-fallback" class="weather-emoji" style="display:none">🌤️</span>
        <span id="weather-temp" class="weather-temp">--°C</span>
      </div>
      <div class="weather-warnings" id="weather-warnings">
        <span class="warning-badge badge-none">☀️ 天氣良好</span>
      </div>
    </div>
  </div>

  <div class="header-right">
    <div class="clock-container">
      <div id="clock"></div>
    </div>
    <div class="time-sub-info">
      <span id="weather-psr" class="weather-psr" style="display:none"></span>
      <div id="date">--年--月--日 星期-</div>
    </div>
  </div>
</header>

<div id="school-closure-notice" class="school-notice"></div>

<main>
  <section class="bus-panel">
    <div class="panel-title">
      <span>🚌 交通到站預計時間</span>
      <button class="settings-btn" onclick="openSettings()">⚙️ 路線設定</button>
    </div>
    <div class="bus-list" id="bus-list"></div>
  </section>
</main>

<!-- 設定 -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">⚙️ 系統及路線設定</div>
      <button class="modal-close" onclick="closeSettings()">&times;</button>
    </div>

    <div class="night-time-section">
      <div class="night-time-title">🌙 夜間黑屏時間設定</div>
      <div class="night-time-inputs">
        <label>開始：
          <input type="time" id="night-start-time" class="config-input" value="20:00" style="width:120px">
        </label>
        <label>結束：
          <input type="time" id="night-end-time" class="config-input" value="05:00" style="width:120px">
        </label>
      </div>
    </div>

    <div class="hint-text">
      💡 當某路線無有效班次時，將顯示「無班次」。NLB 每個方向會自動使用官方 routeId。
    </div>

    <div class="config-list" id="config-list"></div>

    <div class="modal-footer">
      <button class="action-btn add-btn" onclick="addNewBusConfig()">＋ 新增路線</button>
      <button class="action-btn" onclick="saveBusConfig()">💾 保存並即時更新</button>
    </div>
  </div>
</div>

<script>
/* ==================== 狀態 ==================== */
const API={
  kmb:'https://data.etabus.gov.hk/v1/transport/kmb',
  ctb:'https://rt.data.gov.hk/v2/transport/citybus',
  nlb:'https://rt.data.gov.hk/v2/transport/nlb',
  weather:'https://data.weather.gov.hk/weatherAPI/opendata/weather.php'
};

let kmbStopsCache=null,ctbStopsCache={},nlbRouteCache=null;
let currentBuses=[],cachedRawEtas={},nightWakeTimer=null,isManuallyWoken=false;

const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');

const defaultBuses=[
  {company:'lwb',route:'E36A',dir:'inbound',stop:'TC188',origin_name:'逸東邨雍逸樓',dest_name:'往 元朗(德業街)',offset:0},
  {company:'ctb',route:'E21B',dir:'outbound',stop:'001854',origin_name:'逸東邨雍逸樓, 裕東路',dest_name:'往 何文田 (愛民邨)',offset:0}
];

/* ==================== 時鐘 / 夜間 ==================== */
function updateClock(){
  const now=new Date(),h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
  const ampm=h>=12?'下午':'上午',h12=h%12||12;
  const clock=`${h12}:${String(m).padStart(2,'0')}
    <div class="clock-sub-box">
      <span class="clock-ampm">${ampm}</span>
      <span class="clock-seconds">:${String(s).padStart(2,'0')}</span>
    </div>`;

  $('clock').innerHTML=clock;
  $('night-clock').innerHTML=clock;

  const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const date=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${days[now.getDay()]}`;
  $('date').innerText=date;
  $('night-date').innerText=date;
  checkNightMode(now);
}

function checkNightMode(now){
  const start=localStorage.getItem('night_mode_start')||'20:00';
  const end=localStorage.getItem('night_mode_end')||'05:00';
  const toMin=t=>{const p=t.split(':').map(Number);return p[0]*60+p[1]};
  const cur=now.getHours()*60+now.getMinutes(),s=toMin(start),e=toMin(end);
  const night=s<=e?cur>=s&&cur<e:cur>=s||cur<e;

  if(night){
    if(!isManuallyWoken)$('night-screen').classList.add('active');
  }else{
    isManuallyWoken=false;
    $('night-screen').classList.remove('active');
    clearTimeout(nightWakeTimer);
    nightWakeTimer=null;
  }
}

function wakeUpNightScreen(){
  isManuallyWoken=true;
  $('night-screen').classList.remove('active');
  clearTimeout(nightWakeTimer);
  nightWakeTimer=setTimeout(()=>{
    isManuallyWoken=false;
    checkNightMode(new Date());
  },30000);
}

setInterval(updateClock,1000);
updateClock();

/* ==================== 天氣 ==================== */
async function fetchWeatherData(){
  const base=API.weather;

  try{
    const d=await fetch(`${base}?dataType=rhrread&lang=tc`).then(r=>r.json());

    if(d.icon?.length){
      const src=`weather-icons/pic${d.icon[0]}.png`;
      ['weather-icon','night-weather-icon'].forEach(id=>{
        const img=$(id),fallback=$(id==='weather-icon'?'weather-emoji-fallback':'night-weather-emoji');
        img.src=src;
        img.style.display='block';
        fallback.style.display='none';
        img.onerror=function(){
          this.style.display='none';
          fallback.style.display='inline';
          fallback.innerText=id==='weather-icon'
            ?(new Date().getHours()>=18||new Date().getHours()<6?'🌙':'🌤️'):'🌙';
        };
      });
      $('weather-info-box').style.display='flex';
    }

    if(d.temperature?.data){
      const t=d.temperature.data.find(x=>x.place==='香港天文台')||d.temperature.data[0];
      if(t){
        $('weather-temp').innerText=`${t.value}°C`;
        $('night-temp').innerText=`${t.value}°C`;
      }
    }
  }catch(e){}

  try{
    const d=await fetch(`${base}?dataType=flw&lang=tc`).then(r=>r.json());
    if(d.psr){
      const text=`💧 降雨機率: ${d.psr}`;
      ['weather-psr','night-weather-psr'].forEach(id=>{
        $(id).innerText=text;
        $(id).style.display='inline-block';
      });
    }
  }catch(e){}

  try{
    const d=await fetch(`${base}?dataType=warnsum&lang=tc`).then(r=>r.json());
    renderWarnings(d);
  }catch(e){
    renderWarnings({});
  }
}

function renderWarnings(data){
  const badges=[];

  Object.keys(data||{}).forEach(key=>{
    const item=data[key];
    if(!item||item.actionCode==='CANCEL')return;

    const rain={
      WRAINA:'🌧️ 黃雨',
      WRAINR:'🌧️ 紅雨',
      WRAINB:'🌧️ 黑雨'
    };

    if(rain[key]){
      const cls={WRAINA:'badge-yellow-rain',WRAINR:'badge-red-rain',WRAINB:'badge-black-rain'}[key];
      badges.push(`<span class="warning-badge ${cls}">${rain[key]}</span>`);
      return;
    }

    if(key.startsWith('WTCSGN')){
      const code=key.replace('WTCSGN','');
      const names={
        L:'1號戒備',M:'3號強風',
        '8NE':'8號東北','8SE':'8號東南',
        '8NW':'8號西北','8SW':'8號西南',
        '9':'9號烈風','10':'10號颶風'
      };
      badges.push(`<span class="warning-badge badge-tc">🌀 ${names[code]||code+'號風球'}</span>`);
    }else if(key==='WTS'){
      badges.push('<span class="warning-badge badge-ts">⛈️ 雷暴</span>');
    }else if(key==='SMS'){
      badges.push('<span class="warning-badge badge-tc">💨 強烈季候風</span>');
    }
  });

  const night=new Date().getHours()>=18||new Date().getHours()<6;
  const normal=badges.length?badges.join(''):
    `<span class="warning-badge badge-none">${night?'🌙':'☀️'} 天氣良好</span>`;
  const nightHtml=badges.length?badges.join(''):
    '<span class="warning-badge badge-none">🌙 天氣良好</span>';

  $('weather-warnings').innerHTML=normal;
  $('night-warnings').innerHTML=nightHtml;
}

/* ==================== 政府公告 ==================== */
async function fetchGovPressRelease(){
  const box=$('school-closure-notice');
  try{
    const rss='https://www.info.gov.hk/gia/rss/general_zh.xml';
    const proxy='https://api.allorigins.win/get?url='+encodeURIComponent(rss);
    const d=await fetch(proxy).then(r=>r.json());
    const xml=new DOMParser().parseFromString(d.contents,'text/xml');
    const items=[...xml.querySelectorAll('item')].slice(0,25);

    const found=items.find(item=>{
      const text=`${item.querySelector('title')?.textContent||''} ${item.querySelector('description')?.textContent||''}`;
      return (text.includes('停課')||text.includes('所有學校')) &&
        (text.includes('教育局')||text.includes('幼稚園')||text.includes('中小學'));
    });

    if(found){
      const title=found.querySelector('title')?.textContent||'';
      box.innerHTML=`📢 <b>政府新聞公佈：</b> ${title.replace(/<\/?[^>]+>/g,'').trim()}`;
      box.style.display='block';
    }else box.style.display='none';
  }catch(e){
    box.style.display='none';
  }
}

/* ==================== KMB ==================== */
async function getKmbStopsMap(){
  if(kmbStopsCache)return kmbStopsCache;
  try{
    const d=await fetch(`${API.kmb}/stop`).then(r=>r.json());
    kmbStopsCache={};
    (d.data||[]).forEach(s=>kmbStopsCache[s.stop]=s.name_tc);
  }catch(e){
    kmbStopsCache={};
  }
  return kmbStopsCache;
}

async function getKMBSeta(route,stop,dir){
  if(!stop)return [];
  try{
    const d=await fetch(`${API.kmb}/stop-eta/${stop}`).then(r=>r.json());
    const code=dir==='inbound'?'I':'O';
    return (d.data||[]).filter(x=>
      x.route?.toUpperCase()===route.toUpperCase()&&(!x.dir||x.dir===code)
    );
  }catch(e){return []}
}

/* ==================== CTB ==================== */
async function getCTBETA(route,stop,dir){
  if(!stop)return [];
  const direction=dir==='inbound'?'inbound':'outbound';
  let stopId=stop;

  try{
    if(/[\u4e00-\u9fa5]/.test(stop)){
      const d=await fetch(`${API.ctb}/route-stop/CTB/${route.toUpperCase()}/${direction}`).then(r=>r.json());
      if(d.data?.length)stopId=d.data[0].stop;
    }

    const d=await fetch(`${API.ctb}/eta/CTB/${stopId}/${route.toUpperCase()}`).then(r=>r.json());
    const code=direction==='inbound'?'I':'O';
    return (d.data||[]).filter(x=>x.dir===code);
  }catch(e){return []}
}

/* ==================== NLB ==================== */
async function getNLBRouteList(){
  if(nlbRouteCache)return nlbRouteCache;
  try{
    const d=await fetch(`${API.nlb}/route.php?action=list`).then(r=>r.json());
    nlbRouteCache=d?.routes||[];
  }catch(e){nlbRouteCache=[]}
  return nlbRouteCache;
}

async function getNLBStops(routeId){
  if(!routeId)return [];
  try{
    const d=await fetch(`${API.nlb}/stop.php?action=list&routeId=${encodeURIComponent(routeId)}`).then(r=>r.json());
    return d?.stops||[];
  }catch(e){return []}
}

async function getNLBETA(routeId,stopId){
  if(!routeId||!stopId)return [];
  try{
    const url=`${API.nlb}/stop.php?action=estimatedArrivals&routeId=${encodeURIComponent(routeId)}&stopId=${encodeURIComponent(stopId)}&language=zh`;
    const d=await fetch(url).then(r=>r.json());

    return (d?.estimatedArrivals||[]).filter(x=>x?.estimatedArrivalTime).map(x=>{
      let eta=String(x.estimatedArrivalTime).replace(' ','T');
      if(!/[+-]\d\d:\d\d$/.test(eta))eta+='+08:00';
      return {eta,routeVariantName:x.routeVariantName||'',departed:x.departed,noGPS:x.noGPS};
    });
  }catch(e){return []}
}

/* ==================== ETA ==================== */
function buildEtaObjects(raw,now,offset){
  let etas=(raw||[]).map(x=>{
    if(!x?.eta)return null;
    const date=new Date(x.eta);
    if(isNaN(date))return null;

    const sec=Math.round((date-now)/1000)+(offset*60);
    if(sec<-15)return null;

    const mins=Math.round(sec/60);
    return {text:mins<=0?'將到站':`${mins} 分鐘`,mins:Math.max(0,mins)};
  }).filter(Boolean);

  const seen=new Set();
  etas=etas.filter(x=>{
    const k=`${x.text}_${x.mins}`;
    if(seen.has(k))return false;
    seen.add(k);
    return true;
  });

  if(!etas.length)etas=[{text:'無班次',mins:-1}];
  while(etas.length<3)etas.push({text:'-',mins:-1});
  return etas.slice(0,3);
}

function etaClass(e){
  if(e.mins<0)return '';
  if(e.mins===0)return'eta-flash-three';
  if(e.mins<=5)return'eta-flash';
  if(e.mins<=10)return'eta-flash-green';
  return'eta-green';
}

const companyInfo={
  kmb:['九巴','card-kmb'],
  lwb:['龍運','card-lwb'],
  ctb:['城巴','card-ctb'],
  nlb:['嶼巴','card-nlb']
};

function renderBus(bus,etas){
  const [name,cls]=companyInfo[bus.company]||['','card-kmb'];
  const origin=bus.origin_name?`<span class="bus-origin-text">${esc(bus.origin_name)}</span>`:'';
  let dest=bus.dest_name||'';
  if(bus.company==='nlb')dest=dest.replace(/^往\s*/,'');
  const destination=dest?`<span class="bus-dest-text">${esc(dest)}</span>`:'';
  const route=esc(String(bus.route||'').toUpperCase());

  return `
  <div class="bus-item ${cls}">
    <div class="bus-header-grid">
      <span class="bus-company-tag">${name}</span>
      <div class="bus-name">${route}</div>
      <div class="bus-dest">${origin}${destination}</div>
    </div>
    <div class="eta-group">
      <div class="eta-badge first ${etaClass(etas[0])}">${etas[0].text}</div>
      <div class="eta-next-group">
        <div class="eta-badge ${etaClass(etas[1])}">${etas[1].text}</div>
        <div class="eta-badge ${etaClass(etas[2])}">${etas[2].text}</div>
      </div>
    </div>
  </div>`;
}

/* ==================== 公交資料 ==================== */
function loadBusConfigs(){
  const saved=localStorage.getItem('user_bus_configs_v15')||
    localStorage.getItem('user_bus_configs_v14');

  if(!saved){
    currentBuses=defaultBuses.map(x=>({...x}));
    return;
  }

  try{
    currentBuses=JSON.parse(saved).filter(x=>x.company!=='mtr');
    currentBuses.forEach(x=>{
      if(x.company==='nlb'&&!x.nlb_route_id)x.nlb_route_id=x.dir;
    });
  }catch(e){
    currentBuses=defaultBuses.map(x=>({...x}));
  }
}

async function fetchBusData(){
  loadBusConfigs();
  const box=$('bus-list');

  if(!currentBuses.length){
    box.innerHTML='<div class="loading-text">尚未設定任何路線</div>';
    return;
  }

  const order={kmb:1,lwb:2,ctb:3,nlb:4};
  currentBuses.sort((a,b)=>(order[a.company]||99)-(order[b.company]||99));

  const now=new Date();

  const results=await Promise.all(currentBuses.map(async bus=>{
    const dir=bus.dir||'outbound';
    const offset=parseFloat(bus.offset||0);
    const key=`${bus.company}_${bus.route}_${dir}_${bus.stop}`;

    let raw=[];

    if(bus.company==='kmb'||bus.company==='lwb')
      raw=await getKMBSeta(bus.route,bus.stop,dir);
    else if(bus.company==='ctb')
      raw=await getCTBETA(bus.route,bus.stop,dir);
    else if(bus.company==='nlb')
      raw=await getNLBETA(bus.nlb_route_id||bus.dir,bus.stop);

    if(raw.length)cachedRawEtas[key]=raw;
    else if(cachedRawEtas[key])raw=cachedRawEtas[key];

    return renderBus(bus,buildEtaObjects(raw,now,offset));
  }));

  box.innerHTML=results.join('');
}

fetchBusData();
setInterval(fetchBusData,30000);

/* ==================== 設定 UI ==================== */
function openSettings(){
  loadBusConfigs();
  $('night-start-time').value=localStorage.getItem('night_mode_start')||'20:00';
  $('night-end-time').value=localStorage.getItem('night_mode_end')||'05:00';
  renderSettingsList();
  $('settings-modal').classList.add('active');
}

function closeSettings(){
  $('settings-modal').classList.remove('active');
}

function renderRouteControl(company,route,index){
  const hint=company==='nlb'?'路線 (例: 3M、11、B6)':'路線 (例: E33)';
  return `<input type="text" class="config-input bus-route"
    placeholder="${hint}" value="${esc(route||'')}"
    onchange="onBusMetaChanged(${index})">`;
}

function offsetOptions(value){
  let html='';
  for(let sec=-180;sec<=180;sec+=30){
    const v=sec/60;
    const label=v===0?'無微調 (0分)':`${v>0?'+':''}${v} 分鐘 (${v>0?'+':''}${sec}秒)`;
    html+=`<option value="${v}" ${parseFloat(value)===v?'selected':''}>${label}</option>`;
  }
  return html;
}

function renderSettingsList(){
  const box=$('config-list');

  box.innerHTML=currentBuses.map((bus,i)=>{
    const dir=bus.dir||'outbound';
    return `
    <div class="config-item" data-current-stop="${esc(bus.stop||'')}" data-current-dir="${esc(dir)}">
      <div class="config-row">
        <select class="config-select bus-company" onchange="onCompanyChanged(${i})">
          ${[['kmb','九巴 (KMB)'],['lwb','龍運 (LWB)'],['ctb','城巴 (CTB)'],['nlb','新大嶼山巴士 (NLB)']]
            .map(x=>`<option value="${x[0]}" ${bus.company===x[0]?'selected':''}>${x[1]}</option>`).join('')}
        </select>

        <div class="config-route-container">
          ${renderRouteControl(bus.company,bus.route,i)}
        </div>

        <select class="config-select bus-dir" onchange="onDirectionChanged(${i})">
          <option value="${esc(dir)}">方向載入中...</option>
        </select>

        <button class="delete-btn" onclick="deleteBusConfig(${i})">刪除</button>
      </div>

      <div class="config-row">
        <select class="config-select bus-stop" onchange="handleStopChange(${i})">
          <option value="${esc(bus.stop||'')}">${bus.stop?'已選代碼: '+esc(bus.stop):'請選擇車站...'}</option>
        </select>

        <input class="config-input bus-origin" placeholder="起點站名" value="${esc(bus.origin_name||'')}">
        <input class="config-input bus-dest" placeholder="目的地" value="${esc(bus.dest_name||'')}">
        <select class="config-select bus-offset" title="時間微調">${offsetOptions(bus.offset??0)}</select>
      </div>
    </div>`;
  }).join('');

  currentBuses.forEach((_,i)=>{
    updateDirectionOptions(i,false,()=>loadStopOptions(i,false));
  });
}

function itemAt(index){
  return document.querySelectorAll('.config-item')[index];
}

function onCompanyChanged(index){
  const item=itemAt(index);
  if(!item)return;

  const company=item.querySelector('.bus-company').value;
  item.dataset.currentDir='';
  item.dataset.currentStop='';
  item.querySelector('.config-route-container').innerHTML=renderRouteControl(company,'',index);
  onBusMetaChanged(index);
}

function onBusMetaChanged(index){
  updateDirectionOptions(index,true,()=>loadStopOptions(index,true));
}

function onDirectionChanged(index){
  const item=itemAt(index);
  if(!item)return;

  const sel=item.querySelector('.bus-dir');
  item.dataset.currentDir=sel.value;

  const opt=sel.options[sel.selectedIndex];
  if(opt)item.querySelector('.bus-dest').value=opt.text;

  item.dataset.currentStop='';
  loadStopOptions(index,false);
}

/* ==================== 方向 ==================== */
async function updateDirectionOptions(index,userAction,callback){
  const item=itemAt(index);
  if(!item){callback?.();return}

  const company=item.querySelector('.bus-company').value;
  const route=item.querySelector('.bus-route').value.trim().toUpperCase();
  const select=item.querySelector('.bus-dir');
  const current=item.dataset.currentDir||'outbound';
  const dest=item.querySelector('.bus-dest');

  if(!route){
    select.innerHTML='<option value="outbound">請先輸入路線...</option>';
    callback?.();
    return;
  }

  select.innerHTML='<option>方向載入中...</option>';

  try{
    let options=[];

    if(company==='kmb'||company==='lwb'){
      const [o,i]=await Promise.all([
        fetch(`${API.kmb}/route/${route}/outbound/1`).then(r=>r.json()),
        fetch(`${API.kmb}/route/${route}/inbound/1`).then(r=>r.json())
      ]);
      options=[
        ['outbound',`往 ${o?.data?.dest_tc||'去程終點'}`],
        ['inbound',`往 ${i?.data?.dest_tc||'回程終點'}`]
      ];
    }else if(company==='ctb'){
      const d=await fetch(`${API.ctb}/route/CTB/${route}`).then(r=>r.json());
      options=[
        ['outbound',`往 ${d?.data?.dest_tc||'去程終點'}`],
        ['inbound',`往 ${d?.data?.orig_tc||'回程終點'}`]
      ];
    }else if(company==='nlb'){
      const routes=await getNLBRouteList();
      options=routes
        .filter(r=>String(r.routeNo).toUpperCase()===route)
        .map(r=>[
          String(r.routeId),
          `往 ${r.routeName_c||r.routeName_tc||r.routeName_e||''}`
        ]);
    }

    if(!options.length){
      select.innerHTML='<option value="">找不到路線</option>';
      callback?.();
      return;
    }

    select.innerHTML=options.map(x=>
      `<option value="${esc(x[0])}">${esc(x[1])}</option>`
    ).join('');

    if(!userAction){
      const found=[...select.options].findIndex(o=>String(o.value)===String(current));
      if(found>=0)select.selectedIndex=found;
    }

    item.dataset.currentDir=select.value;

    if(userAction&&select.selectedOptions[0])
      dest.value=select.selectedOptions[0].text;

  }catch(e){
    select.innerHTML='<option value="outbound">往 去程</option><option value="inbound">往 回程</option>';
  }

  callback?.();
}

/* ==================== 車站 ==================== */
async function loadStopOptions(index,reset){
  const item=itemAt(index);
  if(!item)return;

  const company=item.querySelector('.bus-company').value;
  const route=item.querySelector('.bus-route').value.trim().toUpperCase();
  const dir=item.querySelector('.bus-dir').value;
  const select=item.querySelector('.bus-stop');
  const current=reset?'':item.dataset.currentStop;

  if(!route||!dir){
    select.innerHTML='<option value="">請先選擇方向...</option>';
    return;
  }

  select.innerHTML='<option value="">車站載入中...</option>';

  try{
    let list=[];

    if(company==='kmb'||company==='lwb'){
      const map=await getKmbStopsMap();
      const d=await fetch(`${API.kmb}/route-stop/${route}/${dir==='inbound'?'inbound':'outbound'}/1`).then(r=>r.json());
      list=(d.data||[]).map((x,i)=>({
        code:x.stop,name:map[x.stop]||`車站 ${x.stop}`,index:i+1
      }));
    }else if(company==='ctb'){
      const d=await fetch(`${API.ctb}/route-stop/CTB/${route}/${dir}`).then(r=>r.json());
      const raw=d.data||[];

      /* CTB stop API 沒有直接返回名稱，因此並行取得 */
      list=await Promise.all(raw.map(async(x,i)=>{
        try{
          const s=await fetch(`${API.ctb}/stop/${x.stop}`).then(r=>r.json());
          return {code:x.stop,name:s?.data?.name_tc||x.stop,index:i+1};
        }catch(e){
          return {code:x.stop,name:x.stop,index:i+1};
        }
      }));
    }else if(company==='nlb'){
      const stops=await getNLBStops(dir);
      list=stops.map((x,i)=>({
        code:x.stopId,
        name:x.stopName_c||x.stopName_tc||x.stopName_e||x.stopId,
        index:i+1
      }));
    }

    select.innerHTML='<option value="">請選擇車站...</option>'+
      list.map(x=>`<option value="${esc(x.code)}" ${String(x.code)===String(current)?'selected':''}>
        ${x.index}. ${esc(x.name)}
      </option>`).join('');

  }catch(e){
    select.innerHTML='<option value="">載入車站失敗</option>';
  }
}

function handleStopChange(index){
  const item=itemAt(index);
  if(!item)return;

  const select=item.querySelector('.bus-stop');
  const opt=select.selectedOptions[0];
  item.dataset.currentStop=select.value;

  if(opt?.value)
    item.querySelector('.bus-origin').value=opt.text.replace(/^\d+\.\s*/,'');
}

/* ==================== 路線增刪儲存 ==================== */
function addNewBusConfig(){
  currentBuses.push({
    company:'kmb',route:'',dir:'outbound',stop:'',
    origin_name:'',dest_name:'',offset:0
  });
  renderSettingsList();
}

function deleteBusConfig(index){
  currentBuses.splice(index,1);
  renderSettingsList();
}

function saveBusConfig(){
  const configs=[...document.querySelectorAll('.config-item')]
    .map(item=>{
      const company=item.querySelector('.bus-company').value;
      const route=item.querySelector('.bus-route').value.trim().toUpperCase();
      const dir=item.querySelector('.bus-dir').value;
      const stop=item.querySelector('.bus-stop').value;

      if(!route||!stop)return null;

      const obj={
        company,route,dir,stop,
        origin_name:item.querySelector('.bus-origin').value.trim(),
        dest_name:item.querySelector('.bus-dest').value.trim(),
        offset:parseFloat(item.querySelector('.bus-offset').value||0)
      };

      if(company==='nlb')obj.nlb_route_id=dir;
      return obj;
    }).filter(Boolean);

  localStorage.setItem('night_mode_start',$('night-start-time').value);
  localStorage.setItem('night_mode_end',$('night-end-time').value);
  localStorage.setItem('user_bus_configs_v15',JSON.stringify(configs));

  closeSettings();
  fetchBusData();
}
